services:
  api:
    build:
      context: .
      dockerfile: backend/MedPath.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__Provider: InMemory
      Jwt__Key: local-compose-only-change-me-32-characters
    ports:
      - "5076:8080"
  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:5076
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - api
